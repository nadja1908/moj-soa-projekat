[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    DB                /fluent-bit/tail/docker.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Tag               docker.*

[FILTER]
    Name                modify
    Match               docker.*
    Add                 service_name unknown
    Add                 container_name unknown

[FILTER]
    Name                lua
    Match               docker.*
    script              /fluent-bit/scripts/docker-metadata.lua
    call                add_docker_metadata

[OUTPUT]
    Name                loki
    Match               docker.*
    Host                loki
    Port                3100
    Labels              job=fluentbit,service_name=$service_name,container_name=$container_name,environment=development,http_method=$http_method,http_status_category=$http_status_category
    Line_format         json
    Remove_keys         time,stream,container_id