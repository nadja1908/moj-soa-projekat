input {
  # Collect logs from Docker containers
  beats {
    port => 5044
  }
  
  # Collect logs via TCP (for applications that send logs directly)
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  # Add container metadata if present
  if [container] {
    mutate {
      add_field => { 
        "service_name" => "%{[container][name]}"
        "container_id" => "%{[container][id]}"
      }
    }
  }

  # Parse timestamp if present
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }

  # Add environment labels
  mutate {
    add_field => { 
      "environment" => "development"
      "project" => "moj-soa-projekat"
    }
  }

  # Parse log levels
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug output (optional, remove in production)
  stdout { 
    codec => rubydebug 
  }
}