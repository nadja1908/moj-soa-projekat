services:
  # 1. Eureka Service Discovery Server
  eureka-server:
    image: steeltoeoss/eureka-server:latest
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_SERVER_ENABLE_SELF_PRESERVATION=false
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --timeout=10 -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 2. API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SERVICE_NAME=API-GATEWAY
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - AUTH_SERVICE_URL=http://auth-service:8003
      - STAKEHOLDERS_SERVICE_URL=http://stakeholders-service:8001
      - BLOG_SERVICE_URL=http://blog-service:8002
      - TOUR_SERVICE_URL=http://tour-service:8004
      - FOLLOWER_SERVICE_URL=http://follower-service:8080
      - TOUR_GRPC_ADDR=tour-service:50051
      
      - PURCHASE_SERVICE_URL=http://purchase-service:8005
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--timeout=10", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      stakeholders-service:
        condition: service_healthy
      blog-service:
        condition: service_healthy
      tour-service:
        condition: service_healthy
      follower-service:
        condition: service_healthy

  # 6. Follower Servis (C# .NET)
  follower-service:
    build:
      context: ./services/follower-service
      dockerfile: Dockerfile
    ports:
      - "8006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Neo4j__Uri=bolt://neo4j:7687
      - Neo4j__User=neo4j
      - Neo4j__Password=neo4jpassword
      - Jwt__Secret=moj-tajni-kljuc-za-jwt-tokenizaciju-2024
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=follower-service,environment=development"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/follower/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      neo4j:
        condition: service_healthy
      purchase-service:
        condition: service_healthy

  # 3. Stakeholders Servis
  stakeholders-service:
    build:
      context: ./services/stakeholders-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - SERVICE_NAME=STAKEHOLDERS-SERVICE
      - DB_USER=user
      - DB_PASS=password
      - DB_HOST=stakeholders-db
      - DB_NAME=stakeholders_db
      - JWT_KEY=moj-tajni-kljuc-za-jwt-tokenizaciju-2024
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - AUTH_SERVICE_URL=http://auth-service:8003
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--timeout=10", "-O", "/dev/null", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      stakeholders-db:
        condition: service_healthy

  # 4. Auth Servis
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
      - "9003:9003"
    environment:
      - PORT=8003
      - RPC_PORT=9003
      - SERVICE_NAME=AUTH-SERVICE
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - STAKEHOLDERS_SERVICE_URL=http://stakeholders-service:8001
      - JWT_KEY=moj-tajni-kljuc-za-jwt-tokenizaciju-2024
      - JWT_REFRESH_KEY=moj-refresh-kljuc-za-jwt-tokenizaciju-2024
      # Observability
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - LOGSTASH_HOST=logstash:5000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--timeout=10", "-O", "/dev/null", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      stakeholders-service:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  # 5. Blog Servis (Go)
  blog-service:
    build:
      context: ./services/blog-service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DB_USER=user
      - DB_PASS=password
      - DB_HOST=blog-db
      - DB_NAME=blog_db
      - AUTH_SERVICE_URL=http://auth-service:8003
      - STAKEHOLDERS_SERVICE_URL=http://stakeholders-service:8001
      - FOLLOWER_SERVICE_URL=http://follower-service:8080
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--timeout=10", "-O", "/dev/null", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      blog-db:
        condition: service_healthy

  # 6. Tour Servis
  tour-service:
    build:
      context: ./services/tour-service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
      - "9004:9004"
    environment:
      - PORT=8004
      - RPC_PORT=9004
      - SERVICE_NAME=TOUR-SERVICE
      - DB_USER=user
      - DB_PASS=password
      - DB_HOST=tour-db
      - DB_NAME=tour_db
      - AUTH_SERVICE_URL=http://auth-service:8003
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--timeout=10", "-O", "/dev/null", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      tour-db:
        condition: service_healthy

  # 4. Baze Podataka
  neo4j:
    image: neo4j:5.13.0
    restart: always
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --timeout=10 -O /dev/null http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  stakeholders-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "root_password"
      MYSQL_DATABASE: "stakeholders_db"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
    ports:
      - "3307:3306"
    volumes:
      - stakeholders-data:/var/lib/mysql
      - ./init-stakeholders.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  blog-db:
    image: mysql:8.0
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "root_password"
      MYSQL_DATABASE: "blog_db"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
    ports:
      - "3308:3306"
    volumes:
      - blog-data:/var/lib/mysql
      - ./init-blog.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  tour-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "root_password"
      MYSQL_DATABASE: "tour_db"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
    ports:
      - "3309:3306"
    volumes:
      - tour-data:/var/lib/mysql
      - ./init-tour.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  purchase-db:
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - purchase-data:/data/db
    networks:
      - app-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })", "purchase-db:27017/admin", "-u", "user", "-p", "password"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    # ... (Ostali servisi)

    # 8. Purchase Servis
  purchase-service:
    build:
      context: ./services/purchase-service
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - SERVICE_NAME=PURCHASE-SERVICE
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - DB_HOST=purchase-db
      - DB_PORT=27017
      - DB_NAME=purchase_db
      - DB_USER=user
      - DB_PASS=password
      - TOUR_SERVICE_URL=http://tour-service:8004
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--timeout=10", "-O", "/dev/null", "http://localhost:8005/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      eureka-server:
        condition: service_healthy
      purchase-db:
        condition: service_healthy
      tour-service:
        condition: service_healthy

  # === OBSERVABILITY STACK ===
  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "14250:14250"  # gRPC collector
      - "6831:6831/udp"  # UDP agent
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --timeout=10 -O /dev/null http://localhost:16686 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Elasticsearch for logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"  # Reduced memory usage
      - bootstrap.memory_lock=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - xpack.encryptedSavedObjects.encryptionKey=a7a6311933d3503b89bc2dbc36572c33a6c10925682e591bffcab6911c06786d
    networks:
      - app-network
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Logstash for log processing
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    restart: unless-stopped
    ports:
      - "5044:5044"  # Beats input  
      - "5000:5000"  # TCP input for JSON logs
      - "9600:9600"  # Logstash monitoring
    volumes:
      - ./observability/logstash/config:/usr/share/logstash/config:ro
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xms128m -Xmx256m"  # Reduced memory
      - "PIPELINE_WORKERS=1"
    networks:
      - app-network
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Filebeat for log shipping
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    user: root
    restart: unless-stopped
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - LOGSTASH_HOSTS=logstash:5044
    networks:
      - app-network
    depends_on:
      - logstash
    command: filebeat -e -strict.perms=false

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --timeout=10 -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana for metrics visualization (avoiding port 3000)
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"  # Changed from 3000 to 3001 to avoid conflict
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --timeout=10 -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter for host machine metrics
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - app-network

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0  # Fixed version for Windows compatibility
    restart: unless-stopped
    ports:
      - "8081:8080"  # Changed from 8080 to 8081 to avoid conflict
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--enable_load_reader=true'
      - '--logtostderr'
      - '--v=2'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  stakeholders-data:
  blog-data:
  tour-data:
  purchase-data:
  # Observability volumes
  elasticsearch-data:
  prometheus-data:
  grafana-data:
  filebeat-data: